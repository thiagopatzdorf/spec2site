  - id: sobre
    titulo: Sobre
    blocos:
      - tipo: texto
        titulo: Da serra pra xícara
        paragrafos:
          - O Café da Serra nasceu em 2021 numa cozinha de 6 m², com um torrador de segunda mão e uma teimosia: café bom não precisa de intermediário.
          - Hoje trabalhamos com três pequenos produtores da serra e torramos toda segunda-feira. Sem estoque encalhado, sem café velho.
      - tipo: lista
        titulo: Como funciona
        itens:
          - titulo: Você pede
            texto: Escolhe o plano e o ponto de torra (claro, médio ou escuro).
          - titulo: A gente torra
            texto: Toda segunda, em lotes de 12 kg, no ponto que você pediu.
          - titulo: Chega fresco
            texto: Enviamos em até 48h depois da torra, com data no rótulo.
      - tipo: faq
        titulo: Dúvidas frequentes
        perguntas:
          - pergunta: Quanto tempo dura o café depois da torra?
            resposta: O pico de sabor é entre 7 e 21 dias da torra. Depois disso ele ainda é bom, mas vai perdendo os aromas mais delicados. Por isso torramos só o necessário pra cada semana.
          - pergunta: Posso escolher o ponto de torra?
            resposta: Sim — claro, médio ou escuro. Se não souber, o médio é o mais equilibrado e agrada a maioria.
          - pergunta: Como funciona a entrega?
            resposta: Torramos na segunda, despachamos na terça e chega em até 48h dependendo da sua região. O frete é calculado no fechamento.
          - pergunta: Dá pra cancelar a assinatura?
            resposta: Sim, a qualquer momento, sem multa. O próximo ciclo simplesmente não é cobrado. Sem burocracia.
